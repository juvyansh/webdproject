<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie Express</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">🍔 Foodie Express</div>

        <input type="text" id="searchBox" placeholder="Search Food">

        <div class="cart-info">
            🛒 Cart: <span id="cartCount">0</span>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Order Food Online</h1>
        <p>Fast Delivery At Your Doorstep</p>
    </section>

    <!-- Categories -->
    <section class="categories">
        <button onclick="filterFood('All')">All</button>
        <button onclick="filterFood('Pizza')">Pizza</button>
        <button onclick="filterFood('Burger')">Burger</button>
        <button onclick="filterFood('Biryani')">Biryani</button>
        <button onclick="filterFood('Healthy')">Healthy</button>
    </section>

    <!-- Food Cards -->
    <section id="foodContainer" class="food-container"></section>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar">

        <h2>Your Cart</h2>

        <div id="cartItems"></div>

        <h3>Total ₹ <span id="totalPrice">0</span></h3>

        <button class="checkout-btn">
            Checkout
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
